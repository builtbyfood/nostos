# Nostos 0.2.3 - ci.yml
# The test steps passed on GitHub on 2026-11-24; the build step then failed on a
# missing executable bit, which is why it now calls bash explicitly.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - name: Python packages
        run: python -m pip install PySide6 smbprotocol cryptography impacket pytest
      - name: Engine and link tests
        run: python -m pytest tests -q
      - name: Window test
        run: QT_QPA_PLATFORM=offscreen python tests/gui_smoke.py
      - name: Build the Windows app
        run: bash build-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NostosAgent
          path: nostos/windows_helper/NostosAgent.exe
